<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>khangs contact</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Courier New', monospace;
      color: #33ff33;
    }

    body {
      background: black;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }

    .container {
      text-align: center;
      animation: fadeIn 2s ease-in-out;
    }

    h1 {
      font-size: 28px;
      position: relative;
      display: inline-block;
      animation: softGlow 3s infinite alternate;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes softGlow {
      0% {
        text-shadow: 0 0 5px #33ff33;
      }

      50% {
        text-shadow: 0 0 10px #33ff33;
      }

      100% {
        text-shadow: 0 0 5px #33ff33;
      }
    }

    .links {
      margin-top: 20px;
    }

    .links a {
      display: block;
      text-decoration: none;
      margin: 5px 0;
      font-size: 16px;
      transition: 0.3s;
    }

    .links a:hover {
      color: #00ff00;
      transform: scale(1.05);
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>khangs contact</h1>
    <p>system online. connection established.</p>
    <p>i will reply as soon as i see your message!!!!</p>
    <p>find me at:</p>
    <div class="links">
      <a href="https://www.linkedin.com/in/vominhkhang" target="_blank">Connect on LinkedIn</a>
      <a href="https://www.facebook.com/vomkhang019/" target="_blank">Find me on Facebook</a>
      <a href="https://www.facebook.com/vomkhang019/" target="_blank">Text me on Messenger</a>
      <a href="https://www.instagram.com/_leaser1/e" target="_blank">Follow me on Instagram</a>
      <a href="https://github.com/leaser019" target="_blank">GitHub: leaser019</a>
      <a href="#">Discord: vominhkhang</a>
    </div>
  </div>
</body>

</html>
